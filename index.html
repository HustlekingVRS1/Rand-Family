<!DOCTYPE html>
<html>

<head>
  <title>Memories</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      background: #000;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .video-container {
      margin: 30px auto;
      max-width: 800px;
    }

    iframe {
      width: 100%;
      height: 450px;
      border: none;
    }

    .audio-section {
      margin-top: 40px;
    }

    .audio-item {
      margin: 25px 0;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }

  </style>
</head>

<body>

<h1>Memories</h1>

<p>of a life that's been loved</p>

<div class="video-container">

  <iframe
    src="https://www.youtube.com/embed/vPGCUgbZX8w"
    allowfullscreen>
  </iframe>

</div>

<div class="audio-section">

  <h2>Audio Files</h2>

  <div class="audio-item">
    <p>Ed Sheeran - Supermarket Flowers (Voicemail edition)</p>

    <audio controls>
      <source src="flowers.mp3" type="audio/mp3">
    </audio>
  </div>

  <div class="audio-item">
    <p>Voicemail 1</p>

    <audio id="autoplayAudio" controls>
      <source src="dads-voicemail-hihi.wav" type="audio/wav">
    </audio>
  </div>

  <div class="audio-item">
    <p>Voicemail 2</p>

    <audio controls>
      <source src="dads-voicemail-hello.wav" type="audio/wav">
    </audio>
  </div>

</div>

<button id="playButton" style="display:none;">
  Tap to Play Voicemail
</button>

<script>

  const params = new URLSearchParams(window.location.search);

  const shouldAutoplay = params.get("qr") === "true";

  const audio = document.getElementById("autoplayAudio");

  const playButton = document.getElementById("playButton");

  if (shouldAutoplay) {

    audio.play()
      .then(() => {

        console.log("Autoplay worked");

      })
      .catch(() => {

        console.log("Autoplay blocked");

        playButton.style.display = "inline-block";

      });

  }

  playButton.addEventListener("click", () => {

    audio.play();

    playButton.style.display = "none";

  });

</script>

</body>

</html>
