<!DOCTYPE html>
<html>

<head>
  <title>Memories</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      background: #000;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
      padding: 30px;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 10px;
    }

    .video-container {
      margin: 30px auto;
      max-width: 800px;
    }

    iframe {
      width: 100%;
      height: 450px;
      border: none;
    }

    .audio-section {
      margin-top: 40px;
    }

    .audio-item {
      margin: 25px 0;
    }

    audio {
      width: 90%;
      max-width: 500px;
    }

    /* MAIN PAGE CONTENT */

    #pageContent {
      transition:
        filter 1.5s ease,
        opacity 1.5s ease;
    }

    .blurred {
      filter: blur(12px) brightness(40%);
      opacity: 0.5;
      pointer-events: none;
      user-select: none;
    }

    /* OVERLAY */

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 9999;

      opacity: 1;
      transition: opacity 1.5s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* BUTTON */

    #continueButton {

      padding: 22px 42px;

      font-size: 24px;

      border: none;

      border-radius: 12px;

      cursor: pointer;

      background: white;

      color: black;

      transition:
        transform 0.2s ease,
        opacity 0.3s ease;

      box-shadow:
        0 0 30px rgba(255,255,255,0.25);
    }

    #continueButton:hover {
      transform: scale(1.05);
    }

  </style>
</head>

<body>

<!-- OVERLAY -->

<div id="overlay" style="display:none;">

  <button id="continueButton">
    Tap Here to Continue
  </button>

</div>

<!-- PAGE CONTENT -->

<div id="pageContent">

  <h1>Memories</h1>

  <p>of a life that's been loved</p>

  <div class="video-container">

    <iframe
      src="https://www.youtube.com/embed/vPGCUgbZX8w"
      allowfullscreen>
    </iframe>

  </div>

  <div class="audio-section">

    <h2>Audio Files</h2>

    <div class="audio-item">

      <p>Voicemail 1</p>

      <audio id="autoplayAudio" controls>
        <source src="dads-voicemail-hihi.wav" type="audio/wav">
      </audio>

    </div>

    <div class="audio-item">

      <p>Voicemail 2</p>

      <audio controls>
        <source src="dads-voicemail-hello.wav" type="audio/wav">
      </audio>

    </div>
	
    <div class="audio-item">

      <p>Ed Sheeran - Supermarket Flowers (Voicemail edition)</p>

      <audio controls>
        <source src="flowers.mp3" type="audio/mp3">
      </audio>

    </div>

  </div>

</div>

<script>

  const params = new URLSearchParams(window.location.search);

  const shouldUseOverlay = params.get("qr") === "true";

  const overlay = document.getElementById("overlay");

  const continueButton = document.getElementById("continueButton");

  const pageContent = document.getElementById("pageContent");

  const audio = document.getElementById("autoplayAudio");

  // ONLY show overlay for QR visitors

  if (shouldUseOverlay) {

    overlay.style.display = "flex";

    pageContent.classList.add("blurred");

  }

  // BUTTON CLICK

  continueButton.addEventListener("click", () => {

    // Play voicemail immediately

    audio.play();

    // Fade overlay away

    overlay.classList.add("hidden");

    // Remove blur from page

    pageContent.classList.remove("blurred");

  });

</script>

</body>

</html>
