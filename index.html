<!DOCTYPE html>
<html>

<head>

  <title>Memories</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      background: #000;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
      padding: 30px;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 10px;
      font-family: "Monotype Corsiva", cursive;
      font-size: 56px;
      font-weight: normal;
    }

    .video-container {
      margin: 30px auto;
      max-width: 800px;
    }

    iframe {
      width: 100%;
      height: 450px;
      border: none;
    }

    .audio-section {
      margin-top: 40px;
    }

    .audio-item {
      margin: 25px 0;
    }

    audio {
      width: 90%;
      max-width: 500px;
    }

    /* CAROUSEL */

    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto 40px auto;
      overflow: hidden;
    }

    .photo-carousel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: transform 0.45s ease;
      transform: translateX(0);
    }

    .photo-carousel.slide-left {
      transform: translateX(-72%);
    }

    .photo-carousel.slide-right {
      transform: translateX(72%);
    }

    .carousel-image {
      flex: 0 0 70%;
      max-width: 800px;
      border-radius: 18px;
      overflow: hidden;
      transition:
        transform 0.45s ease,
        opacity 0.45s ease,
        filter 0.45s ease;
      opacity: 0.45;
      filter: blur(3px) brightness(60%);
      transform: scale(0.85);
    }

    .carousel-image.active {
      opacity: 1;
      filter: blur(0px) brightness(100%);
      transform: scale(1);
    }

    .carousel-image img {
      width: 100%;
      display: block;
    }

    /* MAIN PAGE CONTENT */

    #pageContent {
      transition:
        filter 1.5s ease,
        opacity 1.5s ease;
    }

    .blurred {
      filter: blur(12px) brightness(40%);
      opacity: 0.5;
      pointer-events: none;
      user-select: none;
    }

    /* OVERLAY */

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 1.5s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* BUTTON */

    #continueButton {
      padding: 22px 42px;
      font-size: 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: white;
      color: black;
      transition:
        transform 0.2s ease,
        opacity 0.3s ease;
      box-shadow:
        0 0 30px rgba(255,255,255,0.25);
    }

    #continueButton:hover {
      transform: scale(1.05);
    }

  </style>

</head>

<body>

  <!-- OVERLAY -->

  <div id="overlay" style="display:none;">

    <button id="continueButton">
      Tap Here to Continue
    </button>

  </div>

  <!-- PAGE CONTENT -->

  <div id="pageContent">

    <h1>Memories</h1>

    <p>of a life that's been loved</p>

    <!-- CAROUSEL -->

    <div class="carousel-wrapper">

      <div class="photo-carousel" id="carousel">

        <div class="carousel-image">
          <img id="prevPhoto" src="pic6.jpg">
        </div>

        <div class="carousel-image active">
          <img id="currentPhoto" src="pic1.jpg">
        </div>

        <div class="carousel-image">
          <img id="nextPhoto" src="pic2.jpg">
        </div>

      </div>

    </div>

  <!-- VIDEO -->

      <div class="video-container">
    
        <iframe
          src="https://www.youtube.com/embed/vPGCUgbZX8w"
          allowfullscreen>
        </iframe>
      
      </div>
    
      <div class="video-container">
    
        <iframe
        src="https://www.youtube.com/embed/vPGCUgbZX8w"
        allowfullscreen>
        </iframe>
    
      </div>

    <!-- AUDIO -->

    <div class="audio-section">

      <h2>Audio Files</h2>

      <div class="audio-item">

        <p>Voicemail 1</p>

        <audio id="autoplayAudio" controls>
          <source src="dads-voicemail-hihi.wav" type="audio/wav">
        </audio>

      </div>

      <div class="audio-item">

        <p>Voicemail 2</p>

        <audio controls>
          <source src="dads-voicemail-hello.wav" type="audio/wav">
        </audio>

      </div>

      <div class="audio-item">

        <p>Steve and Annie Chapman - The ships are burning</p>

        <audio controls>
          <source src="Ships.mp3" type="audio/mp3">
        </audio>

      </div>

      <div class="audio-item">

        <p>Glen Campbell - Searchin love</p>

        <audio controls>
          <source src="Searchin.mp3" type="audio/mp3">
        </audio>

      </div>

      <div class="audio-item">

        <p>Ed Sheeran - Supermarket Flowers (Voicemail edition)</p>

        <audio controls>
          <source src="flowers.mp3" type="audio/mp3">
        </audio>

      </div>

    </div>

  </div>

  <script>

    // PHOTO DATA

    const photos = [
      "pic1.jpg",
      "pic2.jpg",
      "pic3.jpg",
      "pic4.jpg",
      "pic5.jpg",
      "pic6.jpg"
    ];

    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;
    let isAnimating = false;

    const carousel =
      document.getElementById("carousel");

    const prevPhoto =
      document.getElementById("prevPhoto");

    const currentPhoto =
      document.getElementById("currentPhoto");

    const nextPhoto =
      document.getElementById("nextPhoto");

    function updatePhotos() {

      const prevIndex =
        (currentIndex - 1 + photos.length) %
        photos.length;

      const nextIndex =
        (currentIndex + 1) %
        photos.length;

      prevPhoto.src =
        photos[prevIndex];

      currentPhoto.src =
        photos[currentIndex];

      nextPhoto.src =
        photos[nextIndex];
    }

    function goNext() {

      if (isAnimating) return;

      isAnimating = true;

      carousel.classList.add("slide-left");

      setTimeout(() => {

        currentIndex =
          (currentIndex + 1) %
          photos.length;

        carousel.style.transition = "none";

        carousel.classList.remove("slide-left");

        updatePhotos();

        carousel.offsetHeight;

        carousel.style.transition = "";

        isAnimating = false;

      }, 450);
    }

    function goPrevious() {

      if (isAnimating) return;

      isAnimating = true;

      carousel.classList.add("slide-right");

      setTimeout(() => {

        currentIndex =
          (currentIndex - 1 + photos.length) %
          photos.length;

        carousel.style.transition = "none";

        carousel.classList.remove("slide-right");

        updatePhotos();

        carousel.offsetHeight;

        carousel.style.transition = "";

        isAnimating = false;

      }, 450);
    }

    carousel.addEventListener("touchstart", (e) => {

      touchStartX =
        e.changedTouches[0].screenX;

    });

    carousel.addEventListener("touchend", (e) => {

      touchEndX =
        e.changedTouches[0].screenX;

      const swipeDistance =
        touchEndX - touchStartX;

      if (swipeDistance < -50) {
        goNext();
      }

      if (swipeDistance > 50) {
        goPrevious();
      }

    });

    updatePhotos();

    // QR OVERLAY

    const params =
      new URLSearchParams(window.location.search);

    const shouldUseOverlay =
      params.get("qr") === "true";

    const overlay =
      document.getElementById("overlay");

    const continueButton =
      document.getElementById("continueButton");

    const pageContent =
      document.getElementById("pageContent");

    const audio =
      document.getElementById("autoplayAudio");

    if (shouldUseOverlay) {

      overlay.style.display = "flex";

      pageContent.classList.add("blurred");
    }

    continueButton.addEventListener("click", () => {

      audio.play();

      overlay.classList.add("hidden");

      pageContent.classList.remove("blurred");

    });

  </script>

</body>

</html>
